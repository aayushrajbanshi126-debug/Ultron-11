name: Build Ultron APK

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download offline speech model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          cd vosk-model-small-en-us-0.15
          zip -rq ../app/src/main/assets/model-en-us.zip .
          cd ..

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "No gradlew found — generating wrapper"
          fi
        continue-on-error: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
